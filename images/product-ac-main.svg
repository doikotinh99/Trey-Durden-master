<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="60%" stop-color="#0a2246"/>
      <stop offset="100%" stop-color="#103b75"/>
    </linearGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="salmonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d30"/>
      <stop offset="100%" stop-color="#ff1a75"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" rx="20" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="450"/>
    <line x1="240" y1="0" x2="240" y2="450"/>
    <line x1="360" y1="0" x2="360" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
  </g>

  <!-- Ambient Glow Behind AC Unit -->
  <circle cx="300" cy="230" r="140" fill="url(#salmonPink)" opacity="0.18" filter="url(#glow)" />
  <circle cx="380" cy="180" r="90" fill="url(#cyanGlow)" opacity="0.22" filter="url(#glow)" />

  <!-- Shadow Base -->
  <ellipse cx="300" cy="385" rx="170" ry="25" fill="#020813" opacity="0.6" />

  <!-- AC Unit Main Outer Housing -->
  <rect x="160" y="100" width="280" height="260" rx="16" fill="url(#metalBody)" stroke="url(#salmonPink)" stroke-width="3" />

  <!-- Top Fan Vent Hood -->
  <rect x="180" y="80" width="240" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <circle cx="300" cy="95" r="9" fill="#ff4d30" />
  
  <!-- Louvered Front Grills (AC Air intake) -->
  <g stroke="#38bdf8" stroke-width="3" opacity="0.65">
    <line x1="185" y1="130" x2="415" y2="130" stroke="#ff4d30" />
    <line x1="185" y1="150" x2="415" y2="150" />
    <line x1="185" y1="170" x2="415" y2="170" />
    <line x1="185" y1="190" x2="415" y2="190" stroke="#ff1a75" />
    <line x1="185" y1="210" x2="415" y2="210" />
    <line x1="185" y1="230" x2="415" y2="230" />
    <line x1="185" y1="250" x2="415" y2="250" stroke="#00e5ff" />
    <line x1="185" y1="270" x2="415" y2="270" />
    <line x1="185" y1="290" x2="415" y2="290" />
    <line x1="185" y1="310" x2="415" y2="310" stroke="#ff4d30" />
  </g>

  <!-- Fan Blades Graphic Inside -->
  <circle cx="300" cy="220" r="55" fill="#091b33" stroke="#ff1a75" stroke-width="2" opacity="0.8" />
  <path d="M 300 220 C 275 190, 275 160, 300 170 C 325 180, 310 210, 300 220 Z" fill="url(#cyanGlow)" opacity="0.8"/>
  <path d="M 300 220 C 330 195, 360 195, 350 220 C 340 245, 310 230, 300 220 Z" fill="url(#cyanGlow)" opacity="0.8"/>
  <path d="M 300 220 C 325 250, 325 280, 300 270 C 275 260, 290 230, 300 220 Z" fill="url(#cyanGlow)" opacity="0.8"/>
  <path d="M 300 220 C 270 245, 240 245, 250 220 C 260 195, 290 210, 300 220 Z" fill="url(#cyanGlow)" opacity="0.8"/>
  <circle cx="300" cy="220" r="14" fill="#ff4d30" stroke="#ffffff" stroke-width="2" />

  <!-- High-Tech Badge on Cabinet -->
  <rect x="230" y="325" width="140" height="24" rx="6" fill="#030914" stroke="#00e5ff" stroke-width="1.5" />
  <text x="300" y="341" fill="#00e5ff" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">BESTCOMFORT 20.5 SEER2</text>

  <!-- Status Overlay Floating Tags -->
  <g transform="translate(30, 40)">
    <rect width="180" height="34" rx="17" fill="#0b2246" stroke="#ff4d30" stroke-width="1.5"/>
    <text x="90" y="22" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">🔥 INVERTER MULTI-TON</text>
  </g>

  <g transform="translate(420, 380)">
    <rect width="150" height="34" rx="17" fill="#0b2246" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="75" y="22" fill="#00e5ff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">❄️ 52 dBA WHISPER</text>
  </g>
</svg>
