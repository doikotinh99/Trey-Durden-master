<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Path for Top Text -->
    <path id="topTextPath" d="M 30,100 A 70,70 0 0,1 170,100" />
    <!-- Path for Bottom Text -->
    <path id="bottomTextPath" d="M 170,100 A 70,70 0 0,1 30,100" />
    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <!-- Ice/Cooling Gradient -->
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Outer Navy Circular Ring -->
  <circle cx="100" cy="100" r="96" fill="#003566" stroke="#001d3d" stroke-width="2"/>
  
  <!-- Inner White Ring -->
  <circle cx="100" cy="100" r="68" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Top Curved Text: BEST COMFORT -->
  <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="16.5" font-weight="900" fill="#ffffff" letter-spacing="3.5">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">BEST COMFORT</textPath>
  </text>

  <!-- Stars on sides -->
  <polygon points="22,100 24,94 30,94 25,90 27,84 22,88 17,84 19,90 14,94 20,94" fill="#ef4444" transform="scale(0.8) translate(5, 23)" />
  <polygon points="178,100 180,94 186,94 181,90 183,84 178,88 173,84 175,90 170,94 176,94" fill="#0284c7" transform="scale(0.8) translate(43, 23)" />

  <!-- Bottom Curved Text: HEATING & COOLING -->
  <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" letter-spacing="2">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">HEATING &amp; COOLING</textPath>
  </text>

  <!-- Center Icon: Dual Flame & Cold Swoosh -->
  <g transform="translate(100, 100) scale(0.95)">
    <!-- Red Heating Flame (Left side) -->
    <path d="M-6,28 C-20,24 -28,8 -24,-8 C-22,-16 -16,-22 -14,-28 C-12,-24 -10,-18 -8,-16 C-4,-24 -6,-32 -2,-38 C0,-26 8,-18 8,-8 C8,-2 4,4 0,8 C-2,10 -4,16 -2,20 C0,24 -3,27 -6,28 Z" fill="url(#flameGrad)" />

    <!-- Blue Cooling Swoosh / Snowflake Fragment (Right side) -->
    <path d="M6,28 C20,24 28,8 24,-8 C22,-14 17,-20 12,-24 C14,-18 12,-12 8,-8 C12,-4 14,4 12,10 C10,16 6,22 6,28 Z" fill="url(#iceGrad)" />
    
    <!-- Snowflake Crystal accents on right -->
    <g stroke="#0284c7" stroke-width="2.5" stroke-linecap="round">
      <line x1="16" y1="-4" x2="32" y2="-4" />
      <line x1="28" y1="-10" x2="28" y2="2" />
      <line x1="12" y1="-18" x2="24" y2="-26" />
      <line x1="12" y1="12" x2="24" y2="20" />
    </g>
  </g>
</svg>
